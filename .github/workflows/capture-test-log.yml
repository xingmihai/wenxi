name: Capture Flutter test log

# Captures the full `flutter test` output and commits it back to this branch.
#
# Why: the Actions log is hosted on blob storage that is not reachable from
# every network, so a failing run cannot always be inspected through the UI or
# the API. Writing the output into the repository makes it readable as a plain
# file.
#
# This lives on the ci-logs branch only. Pushes made with GITHUB_TOKEN do not
# trigger workflows, so the log commit does not start another run.
on:
  push:
    branches: [ci-logs]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-test-log
  cancel-in-progress: true

jobs:
  capture:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
      GOPROXY: https://proxy.golang.org,direct
      GOTOOLCHAIN: go1.24.7
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Resolve locked packages
        run: flutter pub get --enforce-lockfile

      - name: Build the native helper used by integration tests
        shell: pwsh
        run: ./tool/build-native-windows.ps1

      - name: Run Flutter tests and capture the output
        shell: bash
        run: |
          mkdir -p ci-logs
          rm -f ci-logs/*.txt
          set +e
          flutter test --no-pub --concurrency=1 --reporter expanded \
            > ci-logs/full.log 2>&1
          echo "FLUTTER_TEST_EXIT=$?" >> ci-logs/full.log
          set -e
          wc -l ci-logs/full.log

      - name: Extract the failures
        shell: bash
        run: |
          cd ci-logs
          : > failures.txt
          {
            echo "### run $GITHUB_RUN_ID / $GITHUB_SHA"
            echo "### failing progress lines"
            grep -E '^\s*[0-9]{2}:[0-9]{2} \+[0-9]+ -[1-9][0-9]*:' full.log || true
            echo
            echo "### exception blocks"
            awk '/EXCEPTION CAUGHT/{c=40} c&&c--' full.log || true
            echo
            echo "### tail"
            tail -n 200 full.log || true
          } >> failures.txt
          # Keep the committed file well below the 1 MB contents API limit.
          head -c 400000 failures.txt > failures.trimmed
          mv failures.trimmed failures.txt
          # First 400 KB of the raw log, for context the extract may miss.
          head -c 400000 full.log > full-head.txt
          wc -c failures.txt full-head.txt

      - name: Commit the captured log
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-logs/failures.txt ci-logs/full-head.txt
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "ci: capture flutter test log for run ${GITHUB_RUN_ID}"
          git push origin HEAD:ci-logs
